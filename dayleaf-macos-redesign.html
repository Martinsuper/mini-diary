<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日笺 Dayleaf · macOS 视觉升级</title>
  <style>
    :root {
      --bg: oklch(97.55% 0.0045 258.3);
      --surface: oklch(100% 0 0);
      --fg: oklch(31.29% 0.0038 264.5);
      --muted: oklch(49.57% 0.0068 264.5);
      --border: oklch(90.34% 0.0101 267.4);
      --accent: oklch(68.98% 0.1679 252.2);
      --body: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      --red: oklch(64% .21 28);
      --yellow: oklch(82% .16 85);
      --green: oklch(70% .17 145);
    }

    .stage[data-theme="light"] {
      --bg: oklch(97.55% 0.0045 258.3);
      --surface: oklch(100% 0 0);
      --fg: oklch(31.29% 0.0038 264.5);
      --muted: oklch(49.57% 0.0068 264.5);
      --border: oklch(90.34% 0.0101 267.4);
    }
    @media (prefers-color-scheme: light) {
      .stage[data-theme="system"] {
        --bg: oklch(97.55% 0.0045 258.3);
        --surface: oklch(100% 0 0);
        --fg: oklch(31.29% 0.0038 264.5);
        --muted: oklch(49.57% 0.0068 264.5);
        --border: oklch(90.34% 0.0101 267.4);
      }
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); }
    body { min-width: 320px; min-height: 100vh; margin: 0; color: var(--fg); background: var(--bg); font-family: var(--body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, [contenteditable="true"]:focus-visible { outline: 3px solid oklch(from var(--accent) l c h / .72); outline-offset: 2px; }
    .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .stage { min-height: 100vh; display: grid; place-items: center; padding: clamp(16px, 3vw, 48px); background: var(--bg); transition: background .22s ease; }
    .window { width: min(1360px, 100%); height: min(840px, calc(100vh - 32px)); min-height: 620px; display: grid; grid-template-rows: 48px minmax(0, 1fr); overflow: hidden; border: 1px solid oklch(100% 0 0 / .15); border-radius: 20px; background: oklch(from var(--bg) calc(l + .012) c h); box-shadow: 0 30px 96px oklch(0% 0 0 / .42), 0 1px 0 oklch(100% 0 0 / .07) inset; }
    .titlebar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 18px; border-bottom: 1px solid oklch(100% 0 0 / .09); background: oklch(from var(--bg) calc(l + .032) c h / .88); box-shadow: 0 1px 0 oklch(100% 0 0 / .04) inset; backdrop-filter: blur(24px) saturate(140%); }
    .traffic-lights { display: flex; align-items: center; gap: 8px; }
    .traffic-light { position: relative; width: 12px; height: 12px; padding: 0; border: 0; border-radius: 50%; box-shadow: 0 0 0 1px oklch(0% 0 0 / .16) inset, 0 1px 1px oklch(100% 0 0 / .12) inset; }
    .traffic-light::after { position: absolute; inset: 0; display: grid; place-items: center; color: oklch(18% .01 280 / .72); font-family: var(--body); font-size: 9px; font-weight: 800; line-height: 1; opacity: 0; transition: opacity .16s ease; }
    .traffic-light.close::after { content: "×"; }
    .traffic-light.minimize::after { content: "–"; }
    .traffic-light.zoom::after { content: "+"; }
    .traffic-light.close { background: var(--red); }
    .traffic-light.minimize { background: var(--yellow); }
    .traffic-light.zoom { background: var(--green); }
    .window-title { color: var(--muted); font-size: 12px; font-weight: 550; letter-spacing: -.01em; }
    .title-actions { position: relative; z-index: 4; display: flex; justify-content: flex-end; gap: 4px; }
    .chrome-button, .tool-button, .month-button { display: inline-grid; place-items: center; border: 1px solid transparent; color: var(--muted); background: transparent; cursor: pointer; transition: color .18s ease, border-color .18s ease, background .18s ease, transform .18s ease; }
    .chrome-button { width: 30px; height: 30px; border-radius: 8px; }
    .chrome-button:hover, .tool-button:hover, .month-button:hover { color: var(--fg); border-color: oklch(100% 0 0 / .14); background: oklch(100% 0 0 / .08); }
    .chrome-button:active, .tool-button:active, .month-button:active { transform: scale(.95); background: oklch(100% 0 0 / .13); }
    .settings-popover { position: absolute; top: 39px; right: 0; width: 282px; padding: 12px; border: 1px solid oklch(100% 0 0 / .16); border-radius: 13px; color: var(--fg); background: oklch(from var(--surface) l c h / .92); box-shadow: 0 18px 42px oklch(0% 0 0 / .28), 0 1px 0 oklch(100% 0 0 / .08) inset; backdrop-filter: blur(24px) saturate(150%); }
    .settings-popover[hidden] { display: none; }
    .settings-popover-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 3px 3px 11px; }
    .settings-popover-head h2 { margin: 0; color: var(--fg); font-size: 13px; font-weight: 700; letter-spacing: -.02em; }
    .settings-popover-head p { margin: 3px 0 0; color: var(--muted); font-size: 10px; }
    .settings-close { width: 26px; height: 26px; display: grid; place-items: center; padding: 0; border: 1px solid transparent; border-radius: 7px; color: var(--muted); background: transparent; cursor: pointer; }
    .settings-close:hover { color: var(--fg); border-color: oklch(100% 0 0 / .14); background: oklch(100% 0 0 / .09); }
    .theme-options { display: grid; gap: 4px; }
    .theme-option { width: 100%; min-height: 50px; display: grid; grid-template-columns: 40px minmax(0, 1fr) 17px; align-items: center; gap: 9px; padding: 6px; border: 1px solid transparent; border-radius: 9px; color: var(--fg); background: transparent; cursor: pointer; text-align: left; transition: background .18s ease, border-color .18s ease; }
    .theme-option:hover { border-color: oklch(100% 0 0 / .14); background: oklch(100% 0 0 / .07); }
    .theme-option[aria-checked="true"] { border-color: oklch(from var(--accent) l c h / .5); background: oklch(from var(--accent) l c h / .14); }
    .theme-option b, .theme-option small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .theme-option b { font-size: 12px; font-weight: 650; }
    .theme-option small { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .theme-option .check { display: grid; place-items: center; color: var(--accent); font-size: 14px; font-weight: 800; opacity: 0; }
    .theme-option[aria-checked="true"] .check { opacity: 1; }
    .theme-preview { width: 38px; height: 30px; display: grid; grid-template-columns: 10px 1fr; overflow: hidden; border: 1px solid oklch(100% 0 0 / .15); border-radius: 6px; background: oklch(26% .006 301); box-shadow: 0 1px 0 oklch(100% 0 0 / .07) inset; }
    .theme-preview::before { content: ""; background: oklch(30% .005 286); }
    .theme-preview::after { content: ""; margin: 5px; border-radius: 2px; background: oklch(43% .005 286); }
    .theme-preview.light { border-color: oklch(0% 0 0 / .14); background: oklch(91% 0 90); }
    .theme-preview.light::before { background: oklch(86% 0 90); }
    .theme-preview.light::after { background: oklch(99% 0 90); }
    .theme-preview.system { background: linear-gradient(90deg, oklch(27% .006 301) 0 50%, oklch(93% 0 90) 50% 100%); }
    .theme-preview.system::before { background: oklch(35% .005 286); }
    .theme-preview.system::after { background: oklch(97% 0 90); }

    .diary { min-height: 0; display: grid; grid-template-columns: 320px minmax(0, 1fr); }
    .sidebar { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 28px 25px 24px; border-right: 1px solid oklch(100% 0 0 / .09); background: oklch(from var(--bg) calc(l + .026) c h / .82); backdrop-filter: blur(18px) saturate(115%); }
    .search-wrap { position: relative; margin-bottom: clamp(28px, 5vh, 62px); }
    .search-wrap .icon { position: absolute; top: 50%; left: 13px; color: var(--muted); pointer-events: none; transform: translateY(-50%); }
    .search { width: 100%; height: 42px; padding: 0 38px 0 40px; border: 1px solid oklch(100% 0 0 / .11); border-radius: 11px; outline: 0; color: var(--fg); background: oklch(0% 0 0 / .12); box-shadow: 0 1px 1px oklch(0% 0 0 / .18) inset, 0 1px 0 oklch(100% 0 0 / .035); font-size: 14px; transition: background .18s ease, border-color .18s ease, box-shadow .18s ease; }
    .search::placeholder { color: oklch(from var(--muted) l c h / .78); }
    .search:hover { background: oklch(0% 0 0 / .18); }
    .search:focus { border-color: oklch(from var(--accent) l c h / .72); background: oklch(0% 0 0 / .2); box-shadow: 0 0 0 3px oklch(from var(--accent) l c h / .14), 0 1px 1px oklch(0% 0 0 / .2) inset; }
    .clear-search { position: absolute; top: 50%; right: 5px; width: 32px; height: 32px; display: none; place-items: center; padding: 0; border: 0; border-radius: 7px; color: var(--muted); background: transparent; cursor: pointer; transform: translateY(-50%); }
    .clear-search:hover { color: var(--fg); background: oklch(100% 0 0 / .1); }
    .clear-search.is-visible { display: grid; }

    .calendar { flex: 1; }
    .calendar-header { display: grid; grid-template-columns: 36px minmax(0, 1fr) 36px; align-items: center; margin: 0 0 22px; }
    .calendar-header h1 { margin: 0; overflow: hidden; color: var(--fg); font-size: 19px; font-weight: 680; letter-spacing: -.035em; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
    .month-button { width: 32px; height: 32px; border-radius: 9px; }
    .month-button.next { justify-self: end; }
    .weekdays, .day-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .weekdays { margin-bottom: 7px; }
    .weekdays span { height: 28px; display: grid; place-items: center; color: oklch(from var(--muted) l c h / .78); font-size: 11px; font-weight: 520; }
    .calendar-day { height: 39px; display: grid; place-items: center; padding: 0; border: 1px solid transparent; border-radius: 50%; color: var(--fg); background: transparent; cursor: pointer; font-family: var(--body); font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 540; transition: color .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease; }
    .calendar-day:hover:not([disabled]):not(.is-selected) { color: var(--fg); background: oklch(100% 0 0 / .1); }
    .calendar-day:active:not([disabled]) { transform: scale(.94); }
    .calendar-day.has-entry:not(.is-selected) { color: oklch(from var(--accent) calc(l + .1) c h); font-weight: 700; }
    .calendar-day.is-selected { border-color: oklch(from var(--accent) calc(l + .16) c h / .52); color: oklch(99% 0 0); background: oklch(from var(--accent) calc(l + .015) c h); box-shadow: 0 5px 14px oklch(from var(--accent) l c h / .34), 0 1px 0 oklch(100% 0 0 / .14) inset; }
    .calendar-day.is-today:not(.is-selected) { border-color: oklch(from var(--accent) l c h / .75); }
    .calendar-day.is-future { color: oklch(from var(--muted) l c h / .38); cursor: default; }
    .calendar-day.empty { pointer-events: none; }
    .month-button:disabled, .calendar-day:disabled { opacity: .42; cursor: not-allowed; }
    .sidebar-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 18px; border-top: 1px solid var(--border); }
    .saved-indicator { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; }
    .saved-indicator i { width: 7px; height: 7px; border-radius: 50%; background: oklch(70% .17 145); box-shadow: 0 0 0 3px oklch(70% .17 145 / .13); }
    .saved-indicator.is-saving i { background: var(--yellow); box-shadow: 0 0 0 3px oklch(from var(--yellow) l c h / .14); }
    .saved-indicator.is-error { color: oklch(from var(--red) calc(l + .14) c h); }
    .saved-indicator.is-error i { background: var(--red); box-shadow: 0 0 0 3px oklch(from var(--red) l c h / .14); }

    .search-results { display: none; flex: 1; overflow: auto; }
    .search-results.is-visible { display: block; }
    .result-label { display: block; margin-bottom: 12px; color: var(--muted); font-family: var(--mono); font-size: 10px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
    .result-row { width: 100%; min-height: 58px; display: block; padding: 9px 10px; border: 1px solid transparent; border-radius: 9px; color: var(--fg); background: transparent; cursor: pointer; text-align: left; }
    .result-row + .result-row { margin-top: 5px; }
    .result-row:hover { border-color: oklch(100% 0 0 / .1); background: oklch(100% 0 0 / .08); }
    .result-row b, .result-row span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .result-row b { font-size: 12px; font-weight: 650; }
    .result-row span { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .search-empty { display: none; padding: 22px 4px; color: var(--muted); font-size: 12px; text-align: center; }

    .editor { min-width: 0; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) 52px; padding: 26px clamp(28px, 5vw, 84px) 26px clamp(32px, 6vw, 96px); background: oklch(from var(--bg) calc(l + .012) c h); }
    .editor-card { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; border: 1px solid oklch(100% 0 0 / .12); border-radius: 15px 15px 0 0; background: oklch(from var(--surface) calc(l + .012) c h); box-shadow: 0 16px 36px oklch(0% 0 0 / .15), 0 1px 0 oklch(100% 0 0 / .055) inset; }
    .editor-scroll { min-height: 0; overflow: auto; padding: clamp(32px, 5.5vw, 66px) clamp(28px, 6vw, 78px) 52px; }
    .editor-inner { width: min(760px, 100%); margin: 0 auto; }
    .entry-date { margin: 0 0 18px; color: oklch(from var(--muted) l c h / .9); font-size: 13px; font-weight: 520; letter-spacing: -.01em; }
    .entry-title { margin: 0 0 34px; outline: 0; color: var(--fg); font-size: clamp(30px, 3vw, 42px); font-weight: 720; letter-spacing: -.047em; line-height: 1.15; }
    .entry-title:empty::before { content: attr(data-placeholder); color: oklch(from var(--muted) l c h / .5); }
    .entry-body { min-height: 340px; outline: 0; color: var(--fg); font-size: clamp(16px, 1.2vw, 18px); line-height: 1.78; letter-spacing: -.018em; }
    .entry-body p { margin: 0 0 1.1em; }
    .entry-body ul { margin: 0 0 1.2em; padding-left: 1.25em; }
    .entry-body li + li { margin-top: .3em; }
    .entry-body:empty::before { content: attr(data-placeholder); color: oklch(from var(--muted) l c h / .5); }
    .entry-empty-state { max-width: 38ch; margin: 22px 0 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .editor-toolbar { min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px 0 11px; border: 1px solid oklch(100% 0 0 / .12); border-top: 1px solid oklch(100% 0 0 / .09); border-radius: 0 0 15px 15px; background: oklch(from var(--bg) calc(l + .008) c h / .9); box-shadow: 0 1px 0 oklch(100% 0 0 / .035) inset; backdrop-filter: blur(12px); }
    .format-tools { display: flex; align-items: center; gap: 3px; }
    .tool-button { width: 36px; height: 34px; border-radius: 9px; font-size: 15px; font-weight: 650; }
    .tool-button strong { font-size: 18px; }
    .tool-button em { font-family: Georgia, serif; font-size: 21px; line-height: 1; }
    .tool-button[aria-pressed="true"] { color: var(--fg); border-color: oklch(100% 0 0 / .15); background: oklch(100% 0 0 / .11); }
    .word-count { color: var(--muted); font-family: var(--mono); font-size: 10px; font-variant-numeric: tabular-nums; }
    .editor-scroll, .search-results { scrollbar-color: oklch(100% 0 0 / .2) transparent; scrollbar-width: thin; }
    .editor-scroll::-webkit-scrollbar, .search-results::-webkit-scrollbar { width: 10px; }
    .editor-scroll::-webkit-scrollbar-thumb, .search-results::-webkit-scrollbar-thumb { border: 3px solid transparent; border-radius: 99px; background: oklch(100% 0 0 / .22); background-clip: padding-box; }
    ::selection { color: oklch(99% 0 0); background: oklch(from var(--accent) l c h / .68); }
    .toast { position: fixed; left: 50%; bottom: 26px; z-index: 3; padding: 9px 13px; border: 1px solid oklch(100% 0 0 / .15); border-radius: 9px; color: var(--fg); background: oklch(from var(--bg) calc(l + .07) c h / .96); box-shadow: 0 12px 28px oklch(0% 0 0 / .32); font-size: 12px; transform: translate(-50%, 18px); opacity: 0; pointer-events: none; transition: transform .18s ease, opacity .18s ease; }
    .toast.is-visible { transform: translate(-50%, 0); opacity: 1; }

    .stage[data-theme="light"] .window { border-color: oklch(0% 0 0 / .16); box-shadow: 0 30px 96px oklch(0% 0 0 / .18), 0 1px 0 oklch(100% 0 0 / .66) inset; }
    .stage[data-theme="light"] .titlebar, .stage[data-theme="light"] .sidebar { border-color: var(--border); }
    .stage[data-theme="light"] .search { border-color: oklch(0% 0 0 / .12); background: oklch(0% 0 0 / .055); box-shadow: 0 1px 1px oklch(0% 0 0 / .09) inset; }
    .stage[data-theme="light"] .search:hover, .stage[data-theme="light"] .search:focus { background: oklch(0% 0 0 / .075); }
    .stage[data-theme="light"] .editor-card, .stage[data-theme="light"] .editor-toolbar { border-color: oklch(0% 0 0 / .12); box-shadow: 0 12px 28px oklch(0% 0 0 / .09), 0 1px 0 oklch(100% 0 0 / .76) inset; }
    .stage[data-theme="light"] .settings-popover { border-color: oklch(0% 0 0 / .14); box-shadow: 0 18px 42px oklch(0% 0 0 / .16), 0 1px 0 oklch(100% 0 0 / .74) inset; }
    .stage[data-theme="light"] .calendar-day.has-entry:not(.is-selected) { color: oklch(from var(--accent) calc(l - .12) c h); }
    .stage[data-theme="light"] .calendar-day.is-selected { border-color: oklch(from var(--accent) calc(l - .04) c h / .64); background: oklch(from var(--accent) calc(l - .12) c h); }
    .stage[data-theme="light"] .saved-indicator.is-error { color: oklch(from var(--red) calc(l - .15) c h); }
    @media (prefers-color-scheme: light) {
      .stage[data-theme="system"] .window { border-color: oklch(0% 0 0 / .16); box-shadow: 0 30px 96px oklch(0% 0 0 / .18), 0 1px 0 oklch(100% 0 0 / .66) inset; }
      .stage[data-theme="system"] .titlebar, .stage[data-theme="system"] .sidebar { border-color: var(--border); }
      .stage[data-theme="system"] .search { border-color: oklch(0% 0 0 / .12); background: oklch(0% 0 0 / .055); box-shadow: 0 1px 1px oklch(0% 0 0 / .09) inset; }
      .stage[data-theme="system"] .search:hover, .stage[data-theme="system"] .search:focus { background: oklch(0% 0 0 / .075); }
      .stage[data-theme="system"] .editor-card, .stage[data-theme="system"] .editor-toolbar { border-color: oklch(0% 0 0 / .12); box-shadow: 0 12px 28px oklch(0% 0 0 / .09), 0 1px 0 oklch(100% 0 0 / .76) inset; }
      .stage[data-theme="system"] .settings-popover { border-color: oklch(0% 0 0 / .14); box-shadow: 0 18px 42px oklch(0% 0 0 / .16), 0 1px 0 oklch(100% 0 0 / .74) inset; }
      .stage[data-theme="system"] .calendar-day.has-entry:not(.is-selected) { color: oklch(from var(--accent) calc(l - .12) c h); }
      .stage[data-theme="system"] .calendar-day.is-selected { border-color: oklch(from var(--accent) calc(l - .04) c h / .64); background: oklch(from var(--accent) calc(l - .12) c h); }
      .stage[data-theme="system"] .saved-indicator.is-error { color: oklch(from var(--red) calc(l - .15) c h); }
    }

    @media (max-width: 820px) { .stage { display: block; padding: 0; } .window { width: 100%; height: auto; min-height: 100vh; border: 0; border-radius: 0; } .diary { grid-template-columns: 1fr; } .sidebar { min-height: 430px; border-right: 0; border-bottom: 1px solid var(--border); } .editor { min-height: 660px; padding: 22px; } }
    @media (max-width: 520px) { .titlebar { padding: 0 12px; } .window-title { display: none; } .titlebar { grid-template-columns: 1fr auto; } .title-actions { display: flex; } .settings-popover { width: min(282px, calc(100vw - 24px)); } .sidebar { padding: 22px 18px; } .editor { padding: 0; background: var(--surface); } .editor-card { border: 0; border-radius: 0; box-shadow: none; } .editor-scroll { padding: 36px 22px; } .editor-toolbar { border-right: 0; border-bottom: 0; border-left: 0; border-radius: 0; } }

    /* Element UI-inspired application shell */
    .stage { padding: clamp(20px, 3vw, 40px); background: var(--bg); }
    .window { width: min(1280px, 100%); height: min(820px, calc(100vh - 48px)); min-height: 600px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); box-shadow: 0 8px 24px oklch(from var(--fg) l c h / .10); }
    .titlebar { grid-template-columns: minmax(0, 1fr) auto; min-height: 56px; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--surface); box-shadow: none; backdrop-filter: none; }
    .traffic-lights { display: none; }
    .app-brand { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--fg); font-size: 16px; font-weight: 600; }
    .app-brand .icon { width: 20px; height: 20px; color: var(--accent); stroke-width: 1.8; }
    .app-brand small { padding-left: 10px; border-left: 1px solid var(--border); color: var(--muted); font-size: 13px; font-weight: 400; }
    .window-title { display: none; }
    .title-actions { gap: 8px; }
    .chrome-button, .tool-button, .month-button { border-color: transparent; color: var(--muted); background: transparent; }

        "2026-08-18": { date: "2026 年 8 月 18 日，星期二", title: "雨后有一点凉", body: "<p>下午的雨来得很短。关上窗时，空气里留下了一点潮湿的草木味。</p>" },
        "2026-08-12": { date: "2026 年 8 月 12 日，星期三", title: "把声音调低", body: "<p>把通知关掉，午饭慢慢吃完。事情没有变少，但心里多出了一点空间。</p>" },
        "2026-08-06": { date: "2026 年 8 月 6 日，星期四", title: "新的笔记本", body: "<p>今天开始用这本新的日记。第一页没有写太多，只记录了一束从窗边落下的光。</p>" }
      };
      const $ = (selector) => document.querySelector(selector);
      const $$ = (selector) => [...document.querySelectorAll(selector)];
      const readStorage = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
      const writeStorage = (key, value) => { try { localStorage.setItem(key, value); return true; } catch { return false; } };
      const restoredEntries = (() => {
        try {
          const parsed = JSON.parse(readStorage("dayleaf-entries") || "{}");
          if (!parsed || Array.isArray(parsed)) return {};
          return Object.fromEntries(Object.entries(parsed).filter(([date, entry]) => /^2026-(0[1-9]|1[0-2])-([0-2][0-9]|3[01])$/.test(date) && entry && typeof entry.date === "string" && typeof entry.title === "string" && typeof entry.body === "string"));
        } catch { return {}; }
      })();
      Object.assign(entries, restoredEntries);
      const title = $("#entryTitle"), body = $("#entryBody"), entryDate = $("#entryDate"), entryEmptyState = $("#entryEmptyState"), wordCount = $("#wordCount"), saveState = $("#saveState"), toast = $("#toast"), search = $("#searchInput"), results = $("#searchResults"), resultLabel = $("#resultLabel"), resultItems = $("#resultItems"), searchEmpty = $("#searchEmpty"), calendar = $("#calendarPanel"), clear = $("#clearSearch"), dayGrid = $("#dayGrid"), monthName = $("#monthName"), previousMonth = $("#previousMonth"), nextMonth = $("#nextMonth"), stage = $(".stage"), settingsButton = $("#settingsButton"), settingsPopover = $("#settingsPopover"), settingsClose = $("#settingsClose"), themeOptions = $$(".theme-option"), toolButtons = $$(".tool-button");
      const todayKey = "2026-08-29";
      let toastTimer, saveIndicatorTimer, selectedDate = todayKey, month = 8, settingsTrigger = settingsButton;
      const showToast = (message) => { toast.textContent = message; toast.classList.add("is-visible"); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove("is-visible"), 1800); };
      const themeLabels = { system: "跟随系统", light: "浅色模式", dark: "深色模式" };
      const closeSettings = () => { settingsPopover.hidden = true; settingsButton.setAttribute("aria-expanded", "false"); };
      const openSettings = (trigger = settingsButton) => { settingsTrigger = trigger; settingsPopover.hidden = false; settingsButton.setAttribute("aria-expanded", "true"); settingsPopover.querySelector('[aria-checked="true"]').focus(); };
      const applyTheme = (theme, persist = true) => { const selected = themeLabels[theme] ? theme : "system"; stage.dataset.theme = selected; themeOptions.forEach((option) => option.setAttribute("aria-checked", String(option.dataset.themeOption === selected))); settingsButton.setAttribute("aria-label", `偏好设置，当前${themeLabels[selected]}`); if (persist) writeStorage("dayleaf-theme", selected); };
      settingsButton.addEventListener("click", () => { if (settingsPopover.hidden) openSettings(settingsButton); else closeSettings(); });
      settingsClose.addEventListener("click", () => { closeSettings(); settingsTrigger.focus(); });
      themeOptions.forEach((option) => option.addEventListener("click", () => { applyTheme(option.dataset.themeOption); closeSettings(); settingsTrigger.focus(); showToast(`已切换为${themeLabels[option.dataset.themeOption]}`); }));
      document.addEventListener("click", (event) => { if (!settingsPopover.hidden && !settingsPopover.contains(event.target) && !settingsButton.contains(event.target)) closeSettings(); });
      settingsPopover.addEventListener("keydown", (event) => {
        const currentIndex = Math.max(0, themeOptions.indexOf(document.activeElement));
        if (["ArrowDown", "ArrowRight", "ArrowUp", "ArrowLeft", "Home", "End"].includes(event.key)) {
          event.preventDefault();
          const nextIndex = event.key === "Home" ? 0 : event.key === "End" ? themeOptions.length - 1 : (currentIndex + (event.key === "ArrowDown" || event.key === "ArrowRight" ? 1 : -1) + themeOptions.length) % themeOptions.length;
          themeOptions[nextIndex].focus();
          applyTheme(themeOptions[nextIndex].dataset.themeOption);
        }
      });
      document.addEventListener("keydown", (event) => { if (event.key === "Escape" && !settingsPopover.hidden) { closeSettings(); settingsTrigger.focus(); } });
      applyTheme(readStorage("dayleaf-theme") || "light", false);
      const updateWordCount = () => { wordCount.textContent = `${body.textContent.replace(/\s/g, "").length} 字`; };
      const updateEmptyState = () => { entryEmptyState.hidden = Boolean(title.textContent.trim() || body.textContent.trim()); };
      const sanitizeEntryHtml = (html) => {
        const template = document.createElement("template");
        template.innerHTML = html;
        template.content.querySelectorAll("script, style, iframe, object, embed, link, meta").forEach((node) => node.remove());
        template.content.querySelectorAll("*").forEach((node) => [...node.attributes].forEach((attribute) => {
          if (/^on/i.test(attribute.name) || attribute.name === "style" || (attribute.name === "href" && !/^(https?:|mailto:|#)/i.test(attribute.value))) node.removeAttribute(attribute.name);
        }));
        return template.innerHTML;
      };
      const setSaveState = (state) => {
        clearTimeout(saveIndicatorTimer);
        saveState.classList.toggle("is-saving", state === "saving");
        saveState.classList.toggle("is-error", state === "error");
        saveState.innerHTML = `<i aria-hidden="true"></i>${state === "saving" ? "正在保存…" : state === "error" ? "未能保存" : "已自动保存"}`;
      };
      const save = () => {
        updateWordCount();
        updateEmptyState();
        const hasContent = Boolean(title.textContent.trim() || body.textContent.trim());
        if (hasContent) entries[selectedDate] = { date: entryDate.textContent, title: title.textContent.trim(), body: sanitizeEntryHtml(body.innerHTML) };
        else delete entries[selectedDate];
        setSaveState("saving");
        const saved = writeStorage("dayleaf-entries", JSON.stringify(entries)) && writeStorage("dayleaf-selected-date", selectedDate);
        dayGrid.querySelector(`[data-date="${selectedDate}"]`)?.classList.toggle("has-entry", hasContent);
        if (!saved) { setSaveState("error"); showToast("未能保存更改，请检查浏览器存储权限"); return; }
        saveIndicatorTimer = setTimeout(() => setSaveState("saved"), 420);
      };
      const bindCalendarDays = () => $$(".calendar-day[data-date]").forEach((day) => day.addEventListener("click", () => setEntry(day.dataset.date)));
      const formatDate = (date) => { const [year, currentMonth, day] = date.split("-").map(Number); const weekday = ["日", "一", "二", "三", "四", "五", "六"][new Date(year, currentMonth - 1, day).getDay()]; return `${year} 年 ${currentMonth} 月 ${day} 日，星期${weekday}`; };
      const renderCalendar = () => {
        const monthPrefix = `2026-${String(month).padStart(2, "0")}`;
        const offset = (new Date(Date.UTC(2026, month - 1, 1)).getUTCDay() + 6) % 7;
        const dayTotal = new Date(Date.UTC(2026, month, 0)).getUTCDate();
        let markup = Array(offset).fill("<span class=\"calendar-day empty\"></span>").join("");
        for (let day = 1; day <= dayTotal; day++) {
          const date = `${monthPrefix}-${String(day).padStart(2, "0")}`;
          const isFuture = date > todayKey, isSelected = date === selectedDate, entry = entries[date];
          const classes = ["calendar-day"];
          if (entry) classes.push("has-entry");
          if (date === todayKey) classes.push("is-today");
          if (isSelected) classes.push("is-selected");
          if (isFuture) classes.push("is-future");
          markup += `<button class="${classes.join(" ")}" type="button" data-date="${date}" aria-label="${formatDate(date)}，${entry ? "已有日记" : "新建日记"}${isSelected ? "，已选中" : ""}" aria-pressed="${isSelected}"${date === todayKey ? " aria-current=\"date\"" : ""}${isFuture ? " disabled" : ""}>${day}</button>`;
        }
        dayGrid.innerHTML = markup;
        monthName.textContent = `2026 年 ${month} 月`;
        dayGrid.setAttribute("aria-label", `${monthName.textContent}日历`);
        previousMonth.disabled = month === 1;
        nextMonth.disabled = month === 8;
        bindCalendarDays();
      };
      const setEntry = (date) => { const entry = entries[date]; selectedDate = date; if (entry) { entryDate.textContent = entry.date; title.textContent = entry.title; body.innerHTML = sanitizeEntryHtml(entry.body); } else { entryDate.textContent = formatDate(date); title.textContent = ""; body.innerHTML = ""; } writeStorage("dayleaf-selected-date", date); renderCalendar(); updateWordCount(); updateEmptyState(); };
      title.addEventListener("input", save); body.addEventListener("input", save);
      const syncFormatState = () => toolButtons.forEach((button) => { try { button.setAttribute("aria-pressed", String(document.queryCommandState(button.dataset.command))); } catch { button.setAttribute("aria-pressed", "false"); } });
      toolButtons.forEach((button) => {
        button.addEventListener("mousedown", (event) => event.preventDefault());
        button.addEventListener("click", () => { body.focus(); document.execCommand(button.dataset.command, false); syncFormatState(); save(); });
      });
      document.addEventListener("selectionchange", () => { if (document.activeElement === body) syncFormatState(); });
      const renderResults = (term) => {
        const query = term.trim().toLocaleLowerCase("zh-CN");
        const matches = Object.entries(entries).filter(([, entry]) => `${entry.title} ${entry.body}`.toLocaleLowerCase("zh-CN").includes(query));
        resultItems.replaceChildren();
        matches.forEach(([date, entry]) => {
          const row = document.createElement("button"), resultTitle = document.createElement("b"), resultDate = document.createElement("span");
          row.className = "result-row"; row.type = "button"; row.dataset.resultDate = date;
          resultTitle.textContent = entry.title || "无标题日记";
          resultDate.textContent = entry.date;
          row.append(resultTitle, resultDate);
          row.addEventListener("click", () => { setEntry(date); search.value = ""; results.classList.remove("is-visible"); calendar.hidden = false; clear.classList.remove("is-visible"); search.focus(); });
          resultItems.append(row);
        });
        resultLabel.textContent = matches.length ? `找到 ${matches.length} 篇日记` : "搜索结果";
        searchEmpty.style.display = matches.length ? "none" : "block";
      };
      search.addEventListener("input", (event) => { const term = event.target.value; const active = term.trim().length > 0; calendar.hidden = active; results.classList.toggle("is-visible", active); clear.classList.toggle("is-visible", active); if (active) renderResults(term); });
      clear.addEventListener("click", () => { search.value = ""; calendar.hidden = false; results.classList.remove("is-visible"); clear.classList.remove("is-visible"); search.focus(); });
      const changeMonth = (amount) => { const next = Math.min(8, Math.max(1, month + amount)); if (next === month) return; month = next; renderCalendar(); showToast(`已切换至 2026 年 ${month} 月`); }; previousMonth.addEventListener("click", () => changeMonth(-1)); nextMonth.addEventListener("click", () => changeMonth(1));
      const savedDate = readStorage("dayleaf-selected-date"); if (/^2026-(0[1-8])-([0-2][0-9]|3[01])$/.test(savedDate || "")) { month = Number(savedDate.slice(5, 7)); setEntry(savedDate); } else { renderCalendar(); updateWordCount(); updateEmptyState(); }
    })();
